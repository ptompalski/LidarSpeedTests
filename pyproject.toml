[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lidarbench"
version = "2.0.0a1"
description = "Cross-platform LiDAR processing software benchmarking orchestration"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Piotr Tompalski" }]
keywords = ["lidar", "benchmarking", "performance", "orchestration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: GIS",
]

dependencies = [
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "psutil>=5.9.0",
]

# Development tools (PEP 735). `uv sync` installs this group by default;
# with pip >= 25.1 use `pip install -e . --group dev`.
[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-timeout>=2.1.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "mypy>=1.7.0",
    "types-pyyaml>=6.0.0",
    "types-psutil>=5.9.0",
]

[project.scripts]
lidarbench = "lidarbench.cli:main"

# Entry-point name must equal the adapter's adapter_id. Real tool adapters
# (cli, lastools, rscript, pylib) are registered when they are implemented.
[project.entry-points."lidarbench.adapters"]
synthetic = "lidarbench.execution.adapters.synthetic:SyntheticAdapter"

[project.entry-points."lidarbench.monitors"]
psutil = "lidarbench.monitoring.psutil_backend:PsutilBackend"

[project.entry-points."lidarbench.validators"]
structural = "lidarbench.validation.structural:StructuralValidator"
r-validation = "lidarbench.validation.r_bridge:RValidationBridge"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["lidarbench*"]

[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["tests/python"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "unit: unit tests (fast, isolated)",
    "integration: integration tests",
    "platform: platform-specific tests",
    "slow: slow tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "venv",
    "build",
    "dist",
    ".eggs",
    "_OLD",
    "R",
    "docs",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["lidarbench"]
known-third-party = ["pydantic", "yaml", "psutil"]

[tool.black]
line-length = 100
target-version = ["py311"]
exclude = """
/(
    \\.git
    | \\.venv
    | venv
    | build
    | dist
    | _OLD
    | R
    | docs
)/
"""

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
