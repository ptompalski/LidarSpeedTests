# Example campaign: native LAStools through the generic execution engine
# (design/ADAPTERS.md §9).
#
#   uv run lidarbench check --adapter lastools
#   lidarbench run configs/examples/lastools-campaign.toml --dry-run
#   lidarbench run configs/examples/lastools-campaign.toml
#
# LAStools is never downloaded, installed or licensed by lidarbench. Point the
# adapter at an existing installation with the bin_dir option below, or with
# $LIDARBENCH_LASTOOLS_BIN, or put its bin directory on PATH. Windows uses the
# vendor's .exe binaries (lascanopy64.exe, lasgrid64.exe); other systems use
# the vendor's native binaries (lascanopy64, lasgrid64) when they exist.
#
# Successful LAStools execution is not validation. From workloads-v4 the contracts
# declare the LAStools cell rule (upward-Y floor edges, as PDAL binmode) and the
# 0.01 m precision of lascanopy averages, so validated LAStools outputs are
# functionally comparable; up to workloads-v3 they were descriptive only.
schema = "lidarbench.campaign-config/1"
campaign_id = "lastools-example-001"
description = "LAStools, mean metric and maximum DSM"
workspace = "/path/to/lidarbench-workspace"
validation_mode = "performance-only"
cpu_counts = [1, 4]                 # passed as -cores N
timeout_s = 7200

[scheduling]
seed = 20261028
repetitions = 3
warmups = 1
tool_order = "balanced"
cooldown_s = 10.0
cache_policy = "uncontrolled-warm"

[monitoring]
enabled = true
backend = "psutil"
interval_s = 0.5
required = true

[scratch]
roots = { local = "/path/to/benchmark-scratch" }
retain = "never"

[integrity]
record_output_digests = true
verify_inputs_at_end = true

[[datasets]]
id = "tiles"
path = "/path/to/input-tiles"
include = ["*.laz"]

[[workloads]]
id = "pixel_metrics_1a"             # lascanopy64 -avg -step 20, all-point height cutoff
parameters = { epsg = 2959 }        # optional declared horizontal CRS (-epsg, no reprojection)

[[workloads]]
id = "generate_DSM1"                # lasgrid64 -highest -step 1
parameters = { epsg = 2959 }

[[tools]]
id = "lastools"
# accept_known_cutoff_warning: accept only the documented lascanopy
# "all values are above the height_cutoff" warning (raw status 0 or 1) as the
# named exception lascanopy_all_values_above_height_cutoff. Without it the mean
# metric fails, because its deliberate below-every-point cutoff always triggers
# that warning. Disabled by default; changing it needs a new campaign ID.
options = { bin_dir = "/path/to/LAStools/bin", accept_known_cutoff_warning = false }
# options = { bin_dir = "C:/LAStools/bin", expected_version = "260914",
#             version_timeout_s = 30.0, accept_known_cutoff_warning = false }
