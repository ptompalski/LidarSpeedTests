# generate_DEM pilot (workloads-v6): linear TIN of ground (2) and water (9) points at 1 m,
# all four tools, 1 and 2 CPUs. Edit the /path/to placeholders, then:
#
#   uv run lidarbench preflight configs/examples/dem-pilot-campaign.toml
#   uv run lidarbench run configs/examples/dem-pilot-campaign.toml
#   uv run lidarbench report WORKSPACE/campaigns/dem-pilot-example-001 --mode performance-only
#
# The contract has no numerical reference (structural validation only), so every
# attempt is "unverified" and every implementation non_comparable: the timings are
# descriptive and appear only in performance-only reports (design/VALIDATION.md §1).
# lasR refuses inputs without .lax indexes. PDAL always runs this workload with
# --nostream (filters.delaunay cannot stream), whatever execution_mode says.
schema = "lidarbench.campaign-config/1"
campaign_id = "dem-pilot-example-001"
description = "generate_DEM pilot: lidR, lasR, LAStools, PDAL; TIN DEM 1 m; 1-2 CPUs"
workspace = "/path/to/lidarbench-pilot/workspace"
validation_mode = "numerical"
cpu_counts = [1, 2]
timeout_s = 1800

[scheduling]
seed = 20261030
repetitions = 3
warmups = 1
tool_order = "balanced"
cooldown_s = 5.0
cache_policy = "uncontrolled-warm"
cpu_affinity = "pinned"

[monitoring]
enabled = true
backend = "psutil"
interval_s = 0.5
required = true

[scratch]
roots = { local = "/path/to/lidarbench-pilot/scratch" }
retain = "on-failure"

[validation]
# lasR and LAStools rasters extend one cell east/north of the tile.
accept_known_extent_discrepancies = true
reuse_identical_outputs = true

[integrity]
record_output_digests = true
verify_inputs_at_end = true

[[datasets]]
id = "pilot-pair"
path = "/path/to/lidarbench-pilot/inputs/tile_1000_density_1"
include = ["*.laz"]

[[workloads]]
id = "generate_DEM"             # linear TIN of classes 2 and 9, 1 m
parameters = { epsg = 2959 }

[[tools]]
id = "lidr"

[[tools]]
id = "lasr"

[[tools]]
id = "lastools"
options = { bin_dir = "/path/to/LAStools/bin" }

[[tools]]
id = "pdal"
options = { executable = "/path/to/conda/envs/pdal/bin/pdal" }
