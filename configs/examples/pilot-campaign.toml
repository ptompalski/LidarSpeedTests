# Small end-to-end pilot: every installed real tool, both workloads with
# contracts, 1 and 2 CPUs, one warm-up and three measured repetitions
# (design/PILOT_REVIEW.md, Task 13). Edit the /path/to placeholders, then:
#
#   uv run lidarbench check                                   # tool availability
#   uv run lidarbench run configs/examples/pilot-campaign.toml --dry-run
#   uv run lidarbench run configs/examples/pilot-campaign.toml
#   uv run lidarbench report WORKSPACE/campaigns/pilot-example-001 --render always
#
# Use a small, verified two-tile dataset with .lax indexes (lasR refuses
# unindexed inputs) and a read-only copy of it, so no tool can write into the
# original files. Use a new campaign_id for every pilot. Run
# `lidarbench preflight` first. The runner validates every succeeded attempt
# (untimed) against the frozen workloads-v3 contracts and reuses verdicts for
# byte-identical outputs (design/VALIDATION.md §8). Each attempt is pinned to
# `cpus` physical cores (scheduling.cpu_affinity; not available on macOS).
schema = "lidarbench.campaign-config/1"
campaign_id = "pilot-example-001"
description = "Pilot: lidR, lasR, LAStools, PDAL; mean metric 20 m and max DSM 1 m; 1-2 CPUs"
workspace = "/path/to/lidarbench-pilot/workspace"
validation_mode = "numerical"
cpu_counts = [1, 2]
timeout_s = 1800

[scheduling]
seed = 20261029
repetitions = 3
warmups = 1
tool_order = "balanced"
cooldown_s = 5.0
cache_policy = "uncontrolled-warm"
cpu_affinity = "pinned"          # enforce the CPU budget (default)

[monitoring]
enabled = true
backend = "psutil"
interval_s = 0.5
required = true

[scratch]
roots = { local = "/path/to/lidarbench-pilot/scratch" }
retain = "on-failure"

[validation]
# lasR rasters extend one cell east/north of the tile; accept that explicitly
# (accepted_exception, never "passed"). Part of the campaign identity.
accept_known_extent_discrepancies = true
reuse_identical_outputs = true
# Compare tools whose validated outputs differ from the contract only at the edges
# (declared boundary-point ownership, accepted outward extent); "strict" (default)
# requires identical cell ownership. Part of the campaign identity.
comparability = "edge-tolerant"

[integrity]
record_output_digests = true
verify_inputs_at_end = true

[[datasets]]
id = "pilot-pair"
path = "/path/to/lidarbench-pilot/inputs/tile_1000_density_1"
include = ["*.laz"]             # .lax indexes are part of the dataset, not inputs

[[workloads]]
id = "pixel_metrics_1a"         # mean original Z, 20 m
parameters = { epsg = 2959 }

[[workloads]]
id = "generate_DSM1"            # maximum original Z, 1 m
parameters = { epsg = 2959 }

[[tools]]
id = "lidr"

[[tools]]
id = "lasr"

[[tools]]
id = "lastools"
# The mean metric's deliberate below-every-point cutoff always triggers the
# lascanopy cutoff warning; accepting it is an explicit, frozen opt-in.
options = { bin_dir = "/path/to/LAStools/bin", accept_known_cutoff_warning = true }

[[tools]]
id = "pdal"
options = { executable = "/path/to/conda/envs/pdal/bin/pdal", execution_mode = "stream" }
