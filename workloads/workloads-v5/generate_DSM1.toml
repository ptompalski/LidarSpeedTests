# Workload contract (lidarbench.workload/1). See pixel_metrics_1a.toml for the layout.
schema = "lidarbench.workload/1"
suite = "workloads-v5"
id = "generate_DSM1"
title = "Maximum original elevation at 1 m"
description = """
Highest original (unnormalized) Z of all points, all classes and returns, in each
owned 1 m cell. No interpolation, subcircle spreading or NA filling: empty cells are
NoData. This is a surface-elevation DSM, not a canopy height model."""

[population]
input = "original"
points = "all"
z = "original"
require_finite_xyz = true
horizontal_units = "metre"

[spatial]
tiling = "per_input_file"
buffer = 20.0

[raster]
resolution = 1.0
origin = [0.0, 0.0]
extent = "header_bounds_snapped_outward"
cell_ownership = "right_down"
empty_cells = "nodata"
bands = []                    # single band; band description is tool-specific
nodata_source = "file_metadata"
forbidden_values = [-9999.0, -1000000.0]

[reference]
method = "cell_statistic"
statistic = "max"

[tolerance]
absolute = 2e-6
relative = 2e-7

[artifacts]
ignored_sidecars = ["*.aux.xml", "*.vrt", "*.tfw"]   # v3: LAStools world files are sidecars

[equivalence]
group = "workloads-v5/generate_DSM1"

[implementations.lidR]
status = "runnable"
equivalence = "matched_definition"
artifacts = ["{stem}.tif"]
cell_ownership = "lidr_buffered_clamp"
extent = "header_bounds_snapped_nearest"   # v5: terra::crop(snap = "near") to the header bounds
band_names = "not_required"
note = "lidR::rasterize_canopy(res = 1, p2r(subcircle = 0, na.fill = NULL)); catalog buffer 20, chunk 0."

[implementations.lasR]
status = "runnable"
equivalence = "matched_definition"
artifacts = ["{stem}.tif"]
cell_ownership = "right_down"
band_names = "not_required"
note = "lasR dsm(1, tin = FALSE); buffer 20, chunk 0."

[implementations.lastools]
status = "runnable"
equivalence = "matched_definition"   # v4: same population, grid and statistic ...
artifacts = ["{stem}.tif"]
cell_ownership = "pdal_binmode_floor" # ... upward-Y floor edges (same rule as PDAL binmode)
band_names = "not_required"
note = "lasgrid -highest -step 1 -buffered 20 -use_orig_bb; v4 declares the upward-Y floor rule: on the Petawawa pilot pair (LAStools 261023) every value and the NoData mask matched that reference exactly (design/PILOT_REVIEW.md §14)."

[implementations.pdal]
status = "runnable"
equivalence = "matched_definition"   # same population, grid and statistic ...
artifacts = ["{stem}.tif"]
cell_ownership = "pdal_binmode_floor" # ... but upward-Y edge ownership: functionally comparable
band_names = "not_required"           # PDAL names the band "max"
note = "writers.gdal binmode=true output_type=max resolution=1, origin/width/height = header bounds snapped outward, nodata -9999, double; readers.las of the tile and every input within the 20 m buffer (filters.merge)."
