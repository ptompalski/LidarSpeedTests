schema = "lidarbench.dataset-recipe/1"
id = "synthetic-tiles-v1"
version = "1"
title = "Synthetic LAS 1.2 tiles for automated tests"
kind = "fixture"
root = "fixtures"
description = """
Small, deterministic LAS 1.2 point-format-1 tiles generated by lidarbench
(lidarbench.datasets.fixtures). Bytes are identical on Linux, Windows and
macOS, so the committed manifests verify everywhere. Test fixtures only:
no CRS is written and they are not benchmark data.
"""

[layout]
inputs = ["*.las"]
las_headers = "required"

[license]
name = "Synthetic data generated by lidarbench (no third-party content)"
redistribution = "permitted"

[source]
citation = "Generated by lidarbench synthetic-tiles-v1"

[declared_metadata]
xyz_units = "metre"

[preparation]
engine = "python"
method = "synthetic-tiles-v1"
generator = "synthetic-tiles-v1"
documentation = "design/DATASETS.md"

[preparation.parameters]
seed = 20261028
origin_x = 500000
origin_y = 5000000
tile_size_m = 100

[[datasets]]
id = "synthetic-tiles-v1/pair"
path = "synthetic-tiles-v1/pair"
title = "Two neighbouring 100 m tiles, 500 points each"
parameters = { tiles_x = 2, tiles_y = 1, points_per_tile = 500 }

[[datasets]]
id = "synthetic-tiles-v1/grid"
path = "synthetic-tiles-v1/grid"
title = "Three by two 100 m tiles, 2000 points each"
parameters = { tiles_x = 3, tiles_y = 2, points_per_tile = 2000 }
