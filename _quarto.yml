project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - results_basic.qmd
    - results_table.qmd
    - results_CPU-RAM.qmd
    - results_complex.qmd
    - results_table_complex.qmd
    - results_tileSize.qmd
    - results_storage.qmd
  resources:
    - tables/
    - figures/
execute:
  freeze: false
  cache: false
  error: false
website:
  title: "LidarSpeedTests"
  repo-url: https://github.com/ptompalski/LidarSpeedTests
  repo-actions:
    - source
    - issue
  navbar:
    pinned: true
    left:
      - href: index.qmd
        text: Home
      - text: Simple tasks
        menu:
          - href: results_basic.qmd
            text: Figures
          - href: results_table.qmd
            text: Tables
          - href: results_CPU-RAM.qmd 
            text: CPU and RAM usage
      - text: Complex tasks
        menu:
          - href: results_complex.qmd
            text: Figures
          - href: results_table_complex.qmd
            text: Tables
      - text: Additional results
        menu:
          - href: results_tileSize.qmd
            text: Influence of tile size
          - href: results_storage.qmd
            text: Influence of storage type
            
      # - href: data.qmd
      #   text: Data
      # - href: contact.qmd
      #   text: Contact
    right: 
      - icon: github
        aria-label: Github
        href: https://github.com/ptompalski/LidarSpeedTests
        
  # page-footer: 
  #   border: true
  #   center: 
  #     - text: 
        

format:
  html:
    theme: sandstone
